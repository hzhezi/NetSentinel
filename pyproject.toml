[project]
name = "netsentinel"
version = "0.1.0"
description = "准实时 NIDS 检测与研判平台：双引擎检测 + LLM 多智能体研判"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "pandas>=2.2",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.54",
    "structlog>=24.4",
    "cachetools>=5.5",
    "aiofiles>=24.1",
    "httpx>=0.27",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# 排除自动生成的迁移文件：它们由 alembic autogenerate 产出，
# 是"历史记录"而非手写代码。对此套用风格规则会导致每次生成迁移
# 都要手工修格式，收益为零。格式统一由 `ruff format` 处理即可。
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
