name: CI

# 什么时候跑：推送到任何分支、以及向 main 提 PR 时。
# 阶段分支开发期间也会跑 —— 早发现问题比合并时才发现便宜。
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # 用真实 PostgreSQL 而非 SQLite 替身（见 AGENTS.md §2.9）。
    # 测试里的 fixture 会为每个测试建独立 schema，因此这里不需要预建表。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: netsentinel
          POSTGRES_PASSWORD: netsentinel
          POSTGRES_DB: netsentinel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U netsentinel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # 指向 CI 的 postgres service。测试用 TEST_DATABASE_URL 覆盖，
      # 避免依赖 .env（CI 里没有该文件）。
      DATABASE_URL: postgresql+asyncpg://netsentinel:netsentinel@localhost:5432/netsentinel
      TEST_DATABASE_URL: postgresql+asyncpg://netsentinel:netsentinel@localhost:5432/netsentinel
      # 占位值：测试不会真实调用 LLM（都注入了假客户端）
      DEEPSEEK_API_KEY: ""

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装 Python
        run: uv python install

      - name: 安装依赖
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: 格式检查 (ruff format)
        run: uv run ruff format --check .

      - name: 类型检查 (mypy)
        run: uv run mypy backend

      - name: 应用迁移
        run: uv run alembic upgrade head

      - name: 测试 (pytest)
        run: uv run pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 单元测试 (vitest)
        run: npm run test

      - name: 构建 (tsc + vite)
        run: npm run build
